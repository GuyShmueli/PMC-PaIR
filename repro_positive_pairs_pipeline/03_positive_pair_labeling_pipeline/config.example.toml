schema_version = 1

[batch]
# OpenAI currently documents a 200 MB Batch JSONL ceiling. Keep headroom for
# serialization and future metadata changes.
max_shard_bytes = 190000000
# This is an internal pipeline safety ceiling, not a provider request-count cap.
max_shard_requests = 45000

